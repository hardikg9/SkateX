<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<title>SkateLog</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --ink: #121826; --muted: #5d6679; --line: #e2e6ef; --soft: #eef2fb;
    --accent: #0b5fff; --accent-ink: #ffffff; --danger: #c62828; --ok: #1b7f3b; --warn-bg: #fff4d6; --warn-ink: #6b4e00;
    --pro: #0b5fff; --elite: #7a3cff; --radius: 14px; --pad: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1117; --card: #171b24; --ink: #e9ecf3; --muted: #9aa3b5; --line: #2a3140; --soft: #1d2433; --accent: #4c8dff;
            --warn-bg: #3a2f10; --warn-ink: #f3d68a; --pro: #4c8dff; --elite: #a37bff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  #proto { background: var(--warn-bg); color: var(--warn-ink); font-size: 12px; padding: 5px var(--pad); text-align: center; }
  main { max-width: 520px; margin: 0 auto; padding: 14px var(--pad) calc(110px + env(safe-area-inset-bottom)); }
  body.onboard main { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 26px; line-height: 1.2; margin: 8px 0 6px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; min-height: 1em; }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 13px 14px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; } .row > .narrow { flex: 0 0 132px; }
  button { font: inherit; font-weight: 650; border: 0; border-radius: 12px; padding: 15px 18px; width: 100%; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); margin-top: 20px; }
  button.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
  button.link { background: none; color: var(--accent); padding: 8px 0; margin-top: 4px; width: auto; font-weight: 600; }
  button.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--line); }
  button.small { width: auto; padding: 8px 14px; margin: 0; font-size: 14px; border-radius: 10px; }
  button:disabled { opacity: .45; cursor: default; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 10px 0; }
  .card.tap { cursor: pointer; }
  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { margin: 0; border-radius: 0; background: var(--card); color: var(--ink); font-weight: 600; padding: 12px 6px; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); font-weight: 400; margin: 0; }
  .check input { width: 22px; height: 22px; flex: 0 0 22px; margin-top: 2px; accent-color: var(--accent); }
  .otp { font-size: 28px; letter-spacing: .5em; text-align: center; font-variant-numeric: tabular-nums; padding-left: .5em; }
  .hero { text-align: center; padding: 48px 0 10px; }
  .logo { width: 84px; height: 84px; border-radius: 22px; background: var(--accent); color: #fff; display: grid; place-items: center;
    font-size: 40px; font-weight: 800; margin: 0 auto 16px; letter-spacing: -2px; }
  .small { font-size: 13px; color: var(--muted); text-align: center; margin-top: 18px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 40px; gap: 10px; }
  .topbar .back { background: none; color: var(--accent); width: auto; margin: 0; padding: 6px 0; }
  .steps { color: var(--muted); font-size: 13px; }
  .choice { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); margin: 10px 0 0; padding: 16px; }
  .choice b { display: block; } .choice span { color: var(--muted); font-weight: 400; font-size: 14px; }
  .choice .ico { font-size: 26px; width: 34px; text-align: center; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: 0 0 40px; font-size: 15px; }
  .meta { color: var(--muted); font-size: 14px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: 0; } .kv > span:first-child { color: var(--muted); } .kv.tap { cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; z-index: 30; }
  #toast.show { opacity: .95; }
  .switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0; font-weight: 400; }
  .switch input { width: 46px; height: 26px; flex: 0 0 46px; accent-color: var(--accent); }
  .who { display: flex; align-items: center; gap: 10px; background: none; color: var(--ink); width: auto; margin: 0; padding: 4px 0; font-weight: 700; font-size: 17px; }
  .who .caret { color: var(--muted); font-size: 13px; }
  .gear { background: none; color: var(--ink); width: auto; margin: 0; padding: 6px; font-size: 22px; }
  #menu { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; }
  #menu.open { display: block; }
  #menu .sheet { position: absolute; left: 12px; right: 12px; top: 56px; max-width: 496px; margin: 0 auto; background: var(--card); border-radius: 16px; padding: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  #menu .item { display: flex; align-items: center; gap: 12px; width: 100%; background: none; color: var(--ink); margin: 0; padding: 10px; border-radius: 10px; text-align: left; font-weight: 600; }
  #menu .item.on { background: var(--soft); }
  #menu .item .plus { width: 40px; text-align: center; font-size: 22px; color: var(--accent); }
  nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 20; }
  nav#tabs[hidden] { display: none; }
  nav#tabs button { background: none; color: var(--muted); margin: 0; padding: 4px 2px; width: 20%; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav#tabs button .i { font-size: 21px; line-height: 1; display: grid; place-items: center; }
  nav#tabs button.on { color: var(--accent); }
  nav#tabs button.skate .i { background: var(--accent); color: #fff; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; margin-top: -22px; box-shadow: 0 4px 14px rgba(11,95,255,.35); }
  .week { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x mandatory; }
  .day { flex: 0 0 52px; scroll-snap-align: center; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; cursor: pointer; }
  .day .d { font-size: 12px; color: var(--muted); } .day .n { font-weight: 700; font-size: 17px; }
  .day .dots { height: 8px; display: flex; gap: 3px; justify-content: center; margin-top: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); } .dot.plan { background: transparent; border: 1.5px solid var(--accent); }
  .day.today { border-color: var(--accent); } .day.sel { background: var(--soft); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat .v { font-size: 22px; font-weight: 750; } .stat .l { font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--soft); color: var(--muted); vertical-align: 2px; }
  .badge.pro { background: var(--pro); color: #fff; } .badge.elite { background: var(--elite); color: #fff; } .badge.unv { background: var(--warn-bg); color: var(--warn-ink); }
  .lockrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .lockrow:last-child { border-bottom: 0; }
  .timer { font-size: 56px; font-weight: 750; text-align: center; font-variant-numeric: tabular-nums; margin: 10px 0 4px; }
  .laps { max-height: 240px; overflow-y: auto; }
  .lapline { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .lapline.best { color: var(--ok); font-weight: 700; }
  .plancard { display: flex; gap: 12px; align-items: center; }
  .plancard .date { flex: 0 0 52px; text-align: center; background: var(--soft); border-radius: 10px; padding: 6px 0; }
  .plancard .date b { display: block; font-size: 18px; } .plancard .date span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .tier { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; margin: 10px 0; }
  .tier.cur { border-color: var(--accent); }
  .tier .top { display: flex; justify-content: space-between; align-items: baseline; }
  svg.spark { width: 100%; height: 70px; display: block; }
  #chat { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 10px; }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 15px; }
  .msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
  .chip { flex: 0 0 auto; width: auto; margin: 0; padding: 8px 12px; font-size: 13.5px; border-radius: 99px; background: var(--soft); color: var(--ink); font-weight: 600; }
  .chip.on { background: var(--accent); color: var(--accent-ink); }

  /* ---- v0.8 Skate look: bold, bright, kid-first (Skate tab, Practice, Race screens only; body.gz) ---- */
  body.gz { --g1: #4f46e5; --g2: #7c3aed; --g3: #f97316; --g4: #facc15; --lime: #a3e635; --cyan: #22d3ee; --gz-card: rgba(255,255,255,.78);
            --gz-ink: #160f2e; --gz-muted: #6b6488; --gz-line: rgba(124,58,237,.14); --gz-r: 18px;
            background: radial-gradient(900px 520px at 110% -10%, #e4e2ff 0, transparent 60%), radial-gradient(700px 520px at -20% 30%, #eef0f6 0, transparent 55%), #f5f6fa;
            color: var(--gz-ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  @media (prefers-color-scheme: dark) {
    body.gz { --gz-card: rgba(30,22,58,.72); --gz-ink: #f5f1ff; --gz-muted: #b9b0d9; --gz-line: rgba(196,170,255,.16);
              background: radial-gradient(900px 520px at 110% -10%, #1e1b4b 0, transparent 60%), #0b0d14; }
  }
  body.gz main { color: var(--gz-ink); }
  body.gz h1 { font-size: 32px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.02em; line-height: 1; margin: 10px 0 14px; }
  body.gz h2 { font-weight: 800; letter-spacing: .08em; color: var(--gz-muted); }
  body.gz p.sub, body.gz .meta, body.gz .hint { color: var(--gz-muted); }
  body.gz .card { background: var(--gz-card); border: 1px solid var(--gz-line); border-radius: var(--gz-r); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
                  box-shadow: 0 10px 30px -18px rgba(76,29,149,.45); }
  body.gz main button:not(.back):not(.topbar button) { border-radius: 16px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 15px; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff;
                   box-shadow: 0 12px 24px -12px rgba(236,72,153,.7); transition: transform .12s ease; }
  body.gz main button:not(.back):not(.topbar button):active { transform: scale(.97); }
  body.gz main button:not(.back):not(.topbar button).secondary { background: var(--gz-card); color: var(--g1); border: 1.5px solid var(--gz-line); box-shadow: none; }
  body.gz main button:not(.back):not(.topbar button).danger { background: transparent; color: #e11d48; box-shadow: none; }
  body.gz .topbar .back { background: none; box-shadow: none; color: var(--g1); font-weight: 800; }
  body.gz input, body.gz select, body.gz textarea { border-radius: 16px; background: var(--gz-card); border-color: var(--gz-line); color: var(--gz-ink); }
  body.gz .seg { border-radius: 999px; border-color: var(--gz-line); background: var(--gz-card); padding: 3px; gap: 3px; }
  body.gz main .seg button:not(.back):not(.topbar button) { border-radius: 999px; background: transparent; color: var(--gz-ink); box-shadow: none; border: 0 !important; }
  body.gz main .seg button:not(.back):not(.topbar button).on { background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; }
  body.gz .chip { border-radius: 999px; background: var(--gz-card); border: 1.5px solid var(--gz-line); font-weight: 700; padding: 8px 14px; }
  body.gz .chip.on { background: var(--gz-ink); color: #d9f99d; border-color: var(--gz-ink); }
  body.gz .badge { border-radius: 999px; font-weight: 800; }
  body.gz .kv { border-color: var(--gz-line); }
  /* sensor pill */
  .gz-sensor { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 12px; border-radius: 999px; background: var(--gz-card); border: 1px solid var(--gz-line);
               backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer; margin: 2px 0 16px; font-weight: 700; }
  .gz-sensor .dot { width: 12px; height: 12px; border-radius: 50%; background: #a8a3bd; flex: 0 0 12px; }
  .gz-sensor.on .dot { background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: gzpulse 1.8s infinite; }
  .gz-sensor .txt { flex: 1; line-height: 1.2; } .gz-sensor .txt small { display: block; font-weight: 600; color: var(--gz-muted); font-size: 12px; }
  .gz-sensor .go { font-size: 13px; font-weight: 800; color: var(--g1); background: rgba(124,58,237,.1); padding: 5px 11px; border-radius: 999px; }
  @keyframes gzpulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 10px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  /* the two big choices */
  .gz-hero { position: relative; overflow: hidden; border-radius: 22px; padding: 24px 22px 22px; margin: 14px 0; color: #fff; cursor: pointer; min-height: 168px;
             box-shadow: 0 22px 40px -22px rgba(76,29,149,.75); transition: transform .15s ease; isolation: isolate; }
  .gz-hero:active { transform: scale(.98); }
  .gz-hero.practice { background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 50%, #7c3aed 100%); }
  .gz-hero.race { background: linear-gradient(135deg, #111827 0%, #7c2d12 55%, #ea580c 100%); box-shadow: 0 22px 40px -22px rgba(234,88,12,.7); }
  .gz-hero::after { content: ""; position: absolute; right: -10%; top: 0; bottom: 0; width: 55%; z-index: -1;
                    background: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 10px, transparent 10px 26px); }
  .gz-hero .ico { position: absolute; right: 16px; top: 16px; width: 74px; height: 74px; color: rgba(255,255,255,.9); }
  .gz-hero .ttl { font-size: 40px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.02em; line-height: 1; }
  .gz-hero .sub2 { margin-top: 8px; font-weight: 700; opacity: .92; max-width: 74%; }
  .gz-hero .pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; background: #d9f99d; color: #0b0d14;
                   padding: 9px 15px; border-radius: 12px; font-weight: 900; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .gz-hero.race .pill { background: #fff; }
  .gz-hero .pill .live { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; animation: gzpulse 1.6s infinite; }
  .gz-hi { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gz-muted); margin: 6px 0 0; }
  /* running practice */
  .gz-timer { text-align: center; border-radius: 22px; padding: 22px 10px 18px; margin: 8px 0 14px; color: #fff;
              background: linear-gradient(135deg, #0b0d14, #1e1b4b 65%, #3730a3); box-shadow: 0 22px 40px -22px rgba(30,27,75,.8); }
  .gz-timer .lbl { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #bef264; }
  .gz-timer .big { font-size: 58px; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .gz-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
  body.gz main button:not(.back):not(.topbar button).gz-tile { border-radius: 18px; padding: 16px 14px; min-height: 104px; font-weight: 800; font-size: 15px; text-transform: none; letter-spacing: 0; line-height: 1.15; cursor: pointer; color: #fff; text-align: left;
             display: flex; flex-direction: column; justify-content: space-between; margin: 0; box-shadow: 0 14px 26px -16px rgba(0,0,0,.45); }
  .gz-tile svg { width: 28px; height: 28px; }
  body.gz main button:not(.back):not(.topbar button).gz-tile.v { grid-column: 1 / 3; min-height: 88px; background: linear-gradient(135deg, #0369a1, #4f46e5); flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; font-size: 19px; }
  body.gz main button:not(.back):not(.topbar button).gz-tile.l { background: linear-gradient(135deg, #065f46, #0d9488); }
  body.gz main button:not(.back):not(.topbar button).gz-tile.n { background: #d9f99d; color: #0b0d14; }
  body.gz main button:not(.back):not(.topbar button).gz-stop { background: linear-gradient(135deg, #e11d48, #be123c); box-shadow: 0 12px 24px -12px rgba(225,29,72,.8); font-size: 18px; padding: 17px; }
  body.gz main button:not(.back):not(.topbar button).gz-go { font-size: 18px; padding: 19px; background: #d9f99d; color: #0b0d14; box-shadow: 0 14px 26px -14px rgba(101,163,13,.8); }
  body.gz main button:not(.back):not(.topbar button).gz-race-go { font-size: 18px; padding: 19px; background: linear-gradient(135deg, #ea580c, #dc2626); box-shadow: 0 14px 26px -12px rgba(239,68,68,.75); }
  body.gz .gz-meet { box-shadow: inset 5px 0 0 #ea580c, 0 10px 30px -18px rgba(76,29,149,.45); }
  body.gz .gz-meet.closed { box-shadow: inset 5px 0 0 #a8a3bd, 0 10px 30px -18px rgba(76,29,149,.3); }
  #print { display: none; }
  @media print {
    @page { size: A4; margin: 14mm 12mm 16mm; }
    body > *:not(#print) { display: none !important; }
    body { background: #fff; color: #121826; }
    #print { display: block; position: relative; font-size: 13px; }
    #print * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #print button, #print details, #print .topbar, #print input, #print select, #print textarea, #print .noprint { display: none !important; }
    #print .card, #print .stat { break-inside: avoid; box-shadow: none; }
    #print .phead { display: flex; justify-content: space-between; border-bottom: 1px solid #ccd; padding-bottom: 6px; margin-bottom: 10px; font-size: 11px; color: #5d6679; }
    #print .wm { position: fixed; top: 46%; left: 50%; transform: translate(-50%, -50%) rotate(-35deg); text-align: center; white-space: nowrap;
                 color: rgba(110, 110, 130, .17); font-weight: 800; font-size: 72px; letter-spacing: .04em; z-index: 9; pointer-events: none; }
    #print .wm small { display: block; font-size: 17px; letter-spacing: 0; font-weight: 700; }
    #print .pfoot { position: fixed; bottom: -10mm; left: 0; right: 0; text-align: center; font-size: 9.5px; color: #5d6679; }
  }
  details summary { cursor: pointer; }
</style>
</head>
<body>
<div id="proto"></div>
<main id="app"></main>
<nav id="tabs" hidden></nav>
<div id="menu"><div class="sheet" id="sheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print" aria-hidden="true"></div>
<script src="i18n.js"></script>
<script>
"use strict";
const APP_VERSION = "0.8.1";
const LEGAL = { terms: "1.0-draft", privacy: "1.0-draft" };
const KEY = "skatelog.proto.v2";
const PRICES = { pro: 10000, elite: 15000, coach: 1000 };
const IMPERIAL = ["US", "LR", "MM"];

// ---------------------------------------------------------------- storage (local; may be unavailable)
let mem = null;
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return mem || {}; } }
function save(s) { mem = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } }
let S = load();
function fresh() { return { settings: { lang: (S && S.settings && S.settings.lang) || "en" }, skaters: [], sessions: [], plans: [], events: [], sensors: [], ai: {},
  club: { feePlans: [], members: {}, payments: [], charges: [], announcements: [] } }; }
S = Object.assign(fresh(), S);
S.club = Object.assign({ feePlans: [], members: {}, payments: [], charges: [], announcements: [] }, S.club || {}); S.ai = S.ai || {};
const DEFAULT_RINKS = [{ id: "mm", name: "Maharashtra Mandal", short: "MM", lap_m: 150 }, { id: "vn", name: "Viman Nagar", short: "VN", lap_m: 200 }];
const WINDOW_H = 3;                                  // stopwatch timings within 3 h of each other join one session
function migrate() {
  S.rinks = S.rinks && S.rinks.length ? S.rinks : DEFAULT_RINKS.map(r => Object.assign({}, r));
  S.skaters.forEach(k => { k.setups = k.setups || []; });
  S.events = S.events || [];
  S.sessions.forEach(x => {
    if (x.items) return;
    x.items = [];
    if (x.laps && x.laps.length) x.items.push({ id: uid(), at: x.date, kind: "laps", laps: x.laps, total: x.duration_s || null });
    if (x.best_lap) x.items.push({ id: uid(), at: x.date, kind: "laps", laps: [x.best_lap] });
    if (x.race_time) x.items.push({ id: uid(), at: x.date, kind: "race", laps: [], total: x.race_time, distance_laps: x.race_distance_laps });
    x.end = x.end || x.date; delete x.laps; delete x.best_lap; delete x.race_time; delete x.race_distance_laps;
  });
}
const persist = () => save(S);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
migrate();

// ---------------------------------------------------------------- i18n
let LANG = S.settings.lang || "en";             // English by default; changed only in Settings
function t(key, vars) {
  let s = (SL_I18N[LANG] && SL_I18N[LANG][key]) || SL_I18N.en[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const T = (k, v) => esc(t(k, v));
function countryName(cc) { try { return new Intl.DisplayNames([LANG], { type: "region" }).of(cc); } catch (e) { return cc; } }
function regionGuess() {
  const loc = (navigator.languages || [navigator.language || ""]).find(l => l.includes("-")) || "";
  const r = (loc.split("-")[1] || "").toUpperCase();
  return SL_COUNTRIES.find(c => c.cc === r) ? r : "IN";
}
const LOC = () => (LANG === "en" ? "en-IN" : LANG);
const money = n => new Intl.NumberFormat(LOC(), { style: "currency", currency: "INR", maximumFractionDigits: 0 }).format(n);
const num = (n, d = 1) => new Intl.NumberFormat(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const dfmt = (d, o) => new Intl.DateTimeFormat(LOC(), o).format(d);
const legal = () => ({
  terms: `<a href="legal/terms.html?lang=${LANG}" target="_blank">${T("terms")}</a>`,
  privacy: `<a href="legal/privacy.html?lang=${LANG}" target="_blank">${T("privacy")}</a>`
});

// ---------------------------------------------------------------- helpers
const $ = s => document.querySelector(s);
function toast(m) { const e = $("#toast"); e.textContent = m; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2200); }
function go(r) { location.hash = r; }
function back(to, step) { return `<div class="topbar">${to ? `<button class="back" onclick="go('${to}')">‹ ${T("back")}</button>` : "<span></span>"}<span class="steps">${step || ""}</span></div>`; }
const fmtPhone = p => `+${p.dial} ${p.number.replace(/(\d{5})(\d+)/, "$1 $2")}`;
const initials = n => (n || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const role = () => S.account && S.account.role;
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const fmtLap = s => s >= 60 ? `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}` : num(s, 1);
function segToggle(id) { $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }); }
const segVal = id => $(`${id} .on`).dataset.v;
function currentSkater() {
  if (S.current === "squad") return null;
  return S.skaters.find(k => k.id === S.current) || S.skaters[0] || null;
}
const sessionsFor = k => S.sessions.filter(s => !k || s.skater_id === k.id);
const okItems = s => (s.items || []).filter(i => !i.faulty);
// a lap faster than 16 m/s or slower than 1.5 m/s for the rink's lap length is a mis-tap, not a lap
const lapOk = (s, v) => { const r = S.rinks.find(z => z.id === s.rink_id), m = r ? r.lap_m : 150; return v >= m / 16 && v <= m / 1.5; };
const lapsAll = s => okItems(s).flatMap(i => (i.laps || []).filter(v => lapOk(s, v)));
const bestLapOf = s => { const l = lapsAll(s); return l.length ? Math.min(...l) : null; };
function bestRun(s, n) {                              // fastest n consecutive laps inside one timing
  let b = null;
  okItems(s).forEach(i => { const L = (i.laps || []).filter(v => lapOk(s, v)); for (let j = 0; j + n <= L.length; j++) { const v = L.slice(j, j + n).reduce((a, x) => a + x, 0); if (b === null || v < b) b = v; } });
  return b;
}
const METRICS = { lap1: s => bestLapOf(s), lap3: s => bestRun(s, 3), lap5: s => bestRun(s, 5) };
const rinkOf = s => S.rinks.find(r => r.id === s.rink_id);
const setupOf = (k, id) => k && (k.setups || []).find(x => x.id === id);
const setupLabel = x => x ? [x.wheels, x.bearings].filter(Boolean).join(" · ") : "";
const counts = s => s.source !== "manual";           // manual entries are kept but never used for bests or averages
function rinkStats(k, rinkId, metric, exceptId) {
  const vals = sessionsFor(k).filter(x => x.rink_id === rinkId && counts(x) && x.id !== exceptId).map(METRICS[metric]).filter(v => v !== null);
  return vals.length ? { n: vals.length, best: Math.min(...vals), avg: vals.reduce((a, b) => a + b, 0) / vals.length } : null;
}
function openSession(kid, rinkId, at) {             // a recent stopwatch session to add this timing to
  return S.sessions.filter(x => x.skater_id === kid && x.rink_id === rinkId && x.source === "stopwatch" && (at - new Date(x.end)) < WINDOW_H * 36e5 && (at - new Date(x.end)) > -6e4)
    .sort((a, b) => b.end.localeCompare(a.end))[0] || null;
}
function lastOf(kid, key) { const x = S.sessions.filter(s => s.skater_id === kid && s[key]).sort((a, b) => b.date.localeCompare(a.date))[0]; return x ? x[key] : null; }
const tod = d => dfmt(new Date(d), { hour: "numeric", minute: "2-digit" });
const ICON = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  plan: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  skate: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/>',
  insights: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  learn: '<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  club: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.7 4 6"/>' };
const icon = n => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
function nextRoute() {
  if (!S.account || !S.loggedIn) return "welcome";
  if (!S.account.role) return "role";
  if (!S.account.name) return "profile";
  if (!S.consent) return "consent";

screens.otp.init = () => {
  if (!S.pending) return;
  const c$ = $("#code"); c$.focus();
  const tick = () => { const b = $("#resend"); if (!b || !S.pending) return clearInterval(screens.otp.timer);
    const left = Math.max(0, 30 - Math.floor((Date.now() - S.pending.sentAt) / 1000)); b.disabled = left > 0; b.textContent = left > 0 ? t("resend_in", { s: left }) : t("resend"); };
  clearInterval(screens.otp.timer); screens.otp.timer = setInterval(tick, 500); tick();
  $("#resend").onclick = () => { S.pending.code = String(Math.floor(100000 + Math.random() * 900000)); S.pending.sentAt = Date.now(); persist(); render(); toast(t("otp_resent")); };
  const verify = () => {
    if (c$.value.replace(/\D/g, "") !== S.pending.code) { $("#err").textContent = t("otp_wrong"); return; }
    const p = S.pending;
    const same = S.account && S.account.phone && S.account.phone.dial === p.dial && S.account.phone.number === p.number;
    if (!same) { S = fresh(); }                   // another number = another account on this phone
    S.account = Object.assign(S.account || {}, { phone: { cc: p.cc, dial: p.dial, number: p.number }, verifiedAt: new Date().toISOString(), country: (S.account && S.account.country) || p.cc });

};

function spark(ss) {

  const xy = pts.map((v, i) => [pad + i * (W - 2 * pad) / (pts.length - 1), pad + (hi === lo ? H / 2 : (v - lo) / (hi - lo) * (H - 2 * pad))]);

}

function readSetup(id, k) {

function nearestRink(pos) {
  let best = null;
  S.rinks.filter(r => r.loc).forEach(r => { const d = distM(pos, r.loc); if (d < 400 && (!best || d < best.d)) best = { r, d }; });

// ================================================================ Session details (timings, you vs you at this rink, fix mistakes)
function cmpRow(k, x, metric, label) {
  const v = METRICS[metric](x); if (v === null) return "";
  const st = rinkStats(k, x.rink_id, metric, x.id), r = rinkOf(x);
  let tag = "";
  if (st && counts(x)) tag = v < st.best ? `<span class="badge pro">${T("new_best")}</span>` : v < st.avg ? `<span class="badge">${T("better_than_avg")}</span>` : "";
  return `<div class="kv tap" data-stat="${metric}"><span>${label}${tag ? " " + tag : ""}<br><span class="hint">${st ? T("avg_best_at", { avg: fmtLap(st.avg), best: fmtLap(st.best), rink: esc(r ? r.short : "") }) : T("first_at", { rink: esc(r ? r.short : "") })}</span></span><span style="font-weight:750;font-size:18px">${fmtLap(v)} s ›</span></div>`;
}
function fadeNote(x) {                                // simple, honest read of the longest timing
  const it = okItems(x).filter(i => (i.laps || []).length >= 3).sort((a, b) => b.laps.length - a.laps.length)[0];
  if (!it) return "";
  const L = it.laps.filter(v => lapOk(x, v)); if (L.length < 3) return "";
  const d = L[L.length - 1] - Math.min(...L.slice(0, 2));
  return Math.abs(d) < 0.4 ? t("pace_even", { n: L.length }) : d > 0 ? t("pace_fade", { n: L.length, d: num(d) }) : t("pace_build", { n: L.length, d: num(-d) });
}

screens.stat = () => {
  const v = S.viewStat, k = v && S.skaters.find(z => z.id === v.kid), r = v && S.rinks.find(z => z.id === v.rink);
  if (!k || !r) { setTimeout(() => go("home")); return ""; }

  const vals = pts.map(p => p.v), lo = Math.min(...vals), hi = Math.max(...vals), avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const W = 300, H = 90, pad = 8, xy = vals.map((y, i) => [pad + (vals.length > 1 ? i * (W - 2 * pad) / (vals.length - 1) : (W - 2 * pad) / 2), pad + (hi === lo ? H / 2 : (y - lo) / (hi - lo) * (H - 2 * pad))]);
  const label = { lap1: t("best_lap"), lap3: t("best_3"), lap5: t("best_5") }[v.metric];
  const bySetup = {}; pts.forEach(p => { const id = p.x.setup_id || "-"; (bySetup[id] = bySetup[id] || []).push(p.v); });

  S.skaters = [prav, aarya]; S.current = prav.id;

// by frame and set Go, each lap and the finish. Go is suggested from the start signal in the sound track; with a sensor
// recording that covers the race, start, laps and finish are filled in from it and only need a check.
const VID = { stream: null, rec: null, chunks: [], blob: null, url: null, t0: null, live: [], marks: { go: null, laps: [], fin: null }, race: null, suggestGo: null, err: null };

async function detectStartSignal(blob, near) {       // sharp, loud sound (whistle, gun, "Go!"): within 3 s before the Go tap if there is one
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx();
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close && ctx.close();
    const d = buf.getChannelData(0), win = Math.round(buf.sampleRate * 0.02), E = [];
    for (let i = 0; i + win < d.length; i += win) { let s = 0; for (let j = i; j < i + win; j++) s += d[j] * d[j]; E.push(Math.sqrt(s / win)); }
    const sorted = [...E].sort((a, b) => a - b), med = sorted[Math.floor(E.length / 2)] || 1e-6, mx = sorted[E.length - 1];
    const i0 = near != null ? Math.max(5, Math.round((near - 3) / 0.02)) : 50, i1 = near != null ? Math.round((near + 0.3) / 0.02) : E.length;
    for (let i = i0; i < Math.min(i1, E.length); i++) if (E[i] > Math.max(med * 6, mx * 0.35) && E[i] > 2 * E[i - 5]) return +(i * 0.02).toFixed(2);
  } catch (e) { /* no sound track or format not decodable here */ }

}
function sensorMatch(e, x, startIso, dur) {          // a sensor recording covering the race fills the marks (real app); prototype: none yet

const phoneSamplerLeft = () => { const m = dayKey(new Date()).slice(0, 7); return !(S.phoneSampler && S.phoneSampler.month === m); };

screens.sensor.init = () => {

  if ($("#spos")) $("#spos").onclick = ev => { const b = ev.target.closest(".chip"); if (!b) return; S.sensorPos = b.dataset.p; render(); };
  $("#ssave").onclick = () => {
    const dev = S.sensorDraft !== undefined ? S.sensorDraft : sensorNow().device;

// ---------------------------------------------------------------- Skate: two choices
screens.skate = () => {
  const k = currentSkater(); S.sensorBack = "skate";
  if (role() === "coach") return `${shellTop()}<h1>${T("skate_title")}</h1><div class="card"><b>${T("coach_sw")}</b><div class="meta">${T("coach_sw_d")}</div></div>`;
  if (!k) return `${shellTop()}<h1>${T("skate_title")}</h1><div class="card meta">${T("squad_empty")}</div>`;

    <div class="sub2">${L ? T("practice_running", { min: Math.round((Date.now() - new Date(L.start)) / 6e4), rink: esc((S.rinks.find(r => r.id === L.rink_id) || {}).short || "") }) : T("practice_d")}</div>

screens.skate.init = () => { if (!SW.running) { SW.race = null; SW.practice = false; } wireWho(); };

// ---------------------------------------------------------------- Practice: confirm and start, then everything happens in the running session

  ${L.sensor && L.sensor.device ? "" : `<div class="hint">${T("free_practice_note")}</div>`}
  <h2>${T("so_far")}</h2><div class="card">${tl.length ? tl.map(x => `<div class="kv"><span>${x.html}</span><span class="meta">${esc(tod(x.at))}</span></div>`).join("") : `<div class="meta">${T("nothing_yet")}</div>`}</div>

    e.textContent = (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(s2).padStart(2, "0"); setTimeout(tick, 250); }; tick();

  $("#lsu").onchange = ev => { $("#lsunew").hidden = ev.target.value !== "+"; if (ev.target.value !== "+" && ev.target.value !== L.setup_id) { L.setup_id = ev.target.value; L.changes.push({ at: new Date().toISOString(), setup_id: L.setup_id }); persist(); render(); } };
  $("#lvid").onclick = () => { vidReset({ practice: true }); go("racevideo"); };
  $("#llap").onclick = () => { Object.assign(SW, { running: false, laps: [], stopped: 0, race: null, practice: true }); go("stopwatch"); };
  $("#lnote").onclick = () => { $("#noteform").hidden = false; $("#ntext").focus(); };
  $("#nadd").onclick = () => { const v = $("#ntext").value.trim(); if (!v) return; L.notes.push({ at: new Date().toISOString(), text: v }); persist(); render(); };

};
function saveLiveTiming(kind, timing) {                 // a timing taken inside the running practice
  const L = S.live; if (!L) return go("practice");
  L.items.push({ id: uid(), at: timing.at, kind, laps: timing.laps, total: timing.total, distance_laps: kind === "race" ? (timing.laps.length || null) : null,
                 setup_id: L.setup_id, source: timing.source, marks: timing.marks || null });
  persist(); toast(t("timing_saved")); go("live");
}

// ---------------------------------------------------------------- Race: meets (several can be active, each over several days)
const FORMATS = [200, 300, 500, 1000, 1500, 3000, 5000];
const WEATHER = ["w_hot", "w_warm", "w_cool", "w_rain", "w_wind", "w_indoor"];
const eventsFor = k => (S.events || []).filter(e => !k || e.skater_id === k.id);
const ord = n => n ? (n % 10 === 1 && n % 100 !== 11 ? n + "st" : n % 10 === 2 && n % 100 !== 12 ? n + "nd" : n % 10 === 3 && n % 100 !== 13 ? n + "rd" : n + "th") : "–";
const raceTime = r => r.official_s || (r.timing && r.timing.total) || null;
const fmtRT = v => v >= 60 ? fmtLap(v) : fmtLap(v) + " s";       // 1:05.1 or 31.4 s
const selfRaces = e => e.races.filter(x => (x.who || "self") === "self");
const hhmm = v => { if (!v) return null; const [h, m] = v.split(":").map(Number); return h * 60 + m; };
function eventDelayMin(e) { const a = hhmm(e.scheduled), b = hhmm(e.actual); return a !== null && b !== null ? b - a : null; }
function practiceRaces(k) {
  const out = [];
  sessionsFor(k).forEach(s => { const rk = rinkOf(s); if (!rk || !rk.lap_m) return;
    okItems(s).filter(i => i.kind === "race" && i.total && i.distance_laps).forEach(i => {
      const m = i.distance_laps * rk.lap_m, pace = i.total / m * 200;
      if (pace >= 14 && pace <= 90) out.push({ m, time: i.total, pace, rink: rk.short, date: i.at }); }); });   // mistaps and test taps are not races
  return out;
}
function practiceFor(k, m) {
  const P = practiceRaces(k); if (!P.length) return null;
  const same = P.filter(p => Math.abs(p.m - m) / m <= 0.25), pool = same.length ? same : P;
  return pool.reduce((a, b) => b.pace < a.pace ? b : a);
}
const raceLabel = x => `${x.m} m${x.round ? " · " + t(x.round) : ""}`;
function eventDays(e) { const d = [...new Set(e.races.map(x => x.day || e.date))].sort(); return d.length ? d : [e.date]; }
function eventCard(e) {
  const r = S.rinks.find(z => z.id === e.rink_id), D = eventDays(e), mine = selfRaces(e);
  const res = mine.map(x => `${x.m} m${x.position ? " " + ord(x.position) : ""}`).join(" · ");
  return `<div class="card tap gz-meet ${e.closed ? "closed" : ""}" data-ev="${e.id}"><span class="badge ${e.closed ? "" : "pro"}">${T(e.closed ? "meet_closed" : "meet_active")}</span>
    <b style="margin-left:6px">${esc(e.name || t("race_event"))}</b><div class="meta">${esc(r ? r.name : "")} · ${esc(dfmt(new Date(D[0] + "T12:00"), { day: "numeric", month: "short" }))}${D.length > 1 ? " – " + esc(dfmt(new Date(D.at(-1) + "T12:00"), { day: "numeric", month: "short" })) : ""} · ${T("races_n", { n: mine.length })}</div>
    ${res ? `<div class="meta">${esc(res)}</div>` : ""}</div>`;
}
function wireEvents() { document.querySelectorAll("[data-ev]").forEach(c => c.onclick = () => { S.viewEvent = c.dataset.ev; persist(); go("race"); }); }
function raceHomeCard(k) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const E = eventsFor(k), last = d => (new Date(eventDays(d).at(-1) + "T00:00") - today) / 864e5;
  const act = E.filter(e => !e.closed), recent = E.filter(e => e.closed && last(e) >= -7);
  const show = act.length ? act : recent.slice(0, 1); if (!show.length) return "";
  return `<h2>${T(act.length ? "meets_now" : "race_latest")}</h2>${show.map(eventCard).join("")}`;
}
screens.races = () => {
  const k = currentSkater(); if (!k) { setTimeout(() => go("skate")); return ""; }
  S.sensorBack = "races";
  const E = eventsFor(k).sort((a, b) => eventDays(b).at(-1).localeCompare(eventDays(a).at(-1)));
  const act = E.filter(e => !e.closed), past = E.filter(e => e.closed);
  return `${back("skate", "")}<h1>${T("race")}</h1>${sensorBar()}
  <h2>${T("meets_active_h")}</h2>${act.map(eventCard).join("") || `<div class="card meta">${T("no_active_meets")}</div>`}
  <div class="row"><button class="gz-race-go" style="font-size:17px" onclick="S.raceAddPast=false;go('raceadd')">${T("new_meet")}</button><button class="secondary" onclick="S.raceAddPast=true;go('raceadd')">${T("past_meet")}</button></div>
  <h2>${T("meets_closed_h")}</h2>${past.map(eventCard).join("") || `<div class="card meta">${T("no_races_yet")}</div>`}`;
};
screens.races.init = wireEvents;
screens.raceadd = () => {
  const k = currentSkater(); if (!k) { setTimeout(() => go("skate")); return ""; }
  const pastM = !!S.raceAddPast;
  return `${back("races", "")}<h1>${T(pastM ? "past_meet_t" : "new_meet_t")}</h1>
  <label for="ren">${T("race_name")}</label><input id="ren" placeholder="${T("race_name_ph")}">
  <label for="rer">${T("rink")}</label>${rinkSelect("rer", lastOf(k.id, "rink_id") || S.rinks[0].id)}
  <label for="red">${T(pastM ? "meet_date" : "meet_starts")}</label><input id="red" type="date" value="${dayKey(new Date())}" ${pastM ? `max="${dayKey(new Date())}"` : ""}>
  <label>${T("race_formats_opt")}</label><div class="chips" id="ref" style="flex-wrap:wrap">${FORMATS.map(m => `<button type="button" class="chip" data-m="${m}">${m} m</button>`).join("")}</div>
  <label for="res">${T("skate_setup")}</label>${setupSelect("res", k, lastOf(k.id, "setup_id"))}
  <div class="err" id="err"></div><button id="resave">${T(pastM ? "past_meet_save" : "new_meet_save")}</button>`;
};
screens.raceadd.init = () => {
  if (!$("#resave")) return;
  wireSetup("res");
  $("#rer").onchange = e => { if (e.target.value === "+") { S.after = "raceadd"; go("rinkadd"); } };
  $("#ref").onclick = e => { const b = e.target.closest(".chip"); if (b) b.classList.toggle("on"); };

                 setup_id: setupId, weather: null, notes: "", created: new Date().toISOString(), closed: false, past: !!S.raceAddPast, races: [] };

screens.race = () => {
  const e = (S.events || []).find(z => z.id === S.viewEvent); if (!e) { setTimeout(() => go("races")); return ""; }
  const k = S.skaters.find(z => z.id === e.skater_id), r = S.rinks.find(z => z.id === e.rink_id), su = setupOf(k, e.setup_id);
  S.sensorBack = "race";
  const days = eventDays(e);
  const row = x => { const other = x.who === "other";
    return `<div class="kv tap" data-rc="${x.id}"><span>${other ? `<span class="badge unv">${T("field")}</span> ${esc(x.other_label || t("someone_else"))} · ` : ""}<b>${esc(raceLabel(x))}</b>${x.photo_finish ? ` <span class="badge">${T("photo_finish")}</span>` : ""}
      ${x.qualified != null ? ` <span class="badge ${x.qualified ? "pro" : ""}">${T(x.qualified ? "qualified" : "out")}</span>` : ""}</span>
      <span>${x.position ? ord(x.position) + " · " : ""}${raceTime(x) ? fmtRT(raceTime(x)) : "–"}</span></div>`; };
  return `${back("races", "")}<h1>${esc(e.name || t("race_event"))}</h1>
  <p class="sub">${esc(k ? k.display_name : "")} · ${esc(r ? r.name : "")} · ${esc(su ? setupLabel(su) : t("setup_unknown"))}${e.closed ? ` · <span class="badge">${T("meet_closed")}</span>` : ""}</p>
  ${e.closed ? "" : `${sensorBar()}<button id="rstart" class="gz-race-go">${T("start_race")}</button>
  <p style="text-align:center"><a href="#" id="rmanual" class="meta">${T("add_race_by_hand")}</a></p>`}

function raceTips(e, k) {
  const tips = [], d = eventDelayMin(e), R = selfRaces(e);
  const starts = R.filter(x => x.sensor && x.sensor.start_s > 0.6);
  if (starts.length) tips.push(t("tip_start", { m: starts.map(x => x.m).join(" / "), v: starts.map(x => num(x.sensor.start_s)).join(" / "), p: num(starts[0].sensor.start_practice_s) }));
  R.forEach(x => { const L = (x.timing && x.timing.laps) || [];
    if (L.length >= 3 && L[1] - Math.min(...L) > 3) tips.push(t("tip_slow_open", { m: x.m, a: fmtLap(L[0]), b: fmtLap(L[1]), best: fmtLap(Math.min(...L.slice(2))) })); });
  R.filter(x => x.photo_finish && x.position && x.position > 1).forEach(x => tips.push(t("tip_split", { m: x.m })));
  const fade = R.filter(x => x.sensor && x.sensor.push_practice && x.sensor.push_late && x.sensor.push_late < x.sensor.push_practice * 0.85)
    .map(x => ({ m: x.m, d: Math.round(100 * (1 - x.sensor.push_late / x.sensor.push_practice)) })).sort((a, b) => b.d - a.d)[0];
  if (fade) tips.push(t("tip_fade", fade));
  const turns = R.filter(x => x.sensor && x.sensor.turns_practice && x.sensor.turns - x.sensor.turns_practice >= 6);
  if (turns.length) tips.push(t("tip_turns", { a: turns.map(x => x.sensor.turns).join(" / "), b: turns.map(x => x.sensor.turns_practice).join(" / ") }));
  if (d !== null && d >= 60) tips.push(t("tip_delay", { h: num(d / 60, 1) }));
  if (e.weather === "w_hot") tips.push(t("tip_heat"));
  return tips;
}

    return F.length ? { x, F, gap: raceTime(x) - raceTime(F[0]) } : null; }).filter(Boolean);
}

// ================================================================ AI coach (Elite) — prototype answers from simple rules
function aiAnswer(q, k) {
  const ql = q.toLowerCase(), name = k.self ? "you" : k.display_name, Name = k.self ? "You" : k.display_name;
  const ss = sessionsFor(k).sort((a, b) => b.date.localeCompare(a.date));
  const cite = list => list.length ? `\n\nBased on: ${list.map(s => `${dfmt(new Date(s.date), { day: "numeric", month: "short" })} (${s.source === "stopwatch" ? t("stopwatch_src") : t("manual_src")})`).join(", ")}. These are hand-timed, so treat small differences with care.` : "";
  if (/injur|pain|hurt|sore|diet|weight|eat|food|sick|doctor|medic|sleep/.test(ql))
    return `That's a question for ${k.self ? "your" : name + "'s"} coach or a doctor, not for me. I can help with sessions, lap times, technique and what to practise.`;
  if (!ss.length) return `I don't have any sessions for ${name} yet. Record one from the Skate tab (the stopwatch works without a sensor) and ask me again.`;
  const lapsOf = lapsAll;
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  if (/stroke rate|cadence|strokes/.test(ql))
    return "Stroke rate is how many pushes per minute. In our rink tests cruising was about 130 per minute, and standing-start bursts reached 160–220 per minute for the first 2–3 seconds. A sensor session measures it automatically; the stopwatch can't.";
  if (/compare|last two|previous|before/.test(ql)) {
    const two = ss.filter(s => lapsOf(s).length).slice(0, 2);
    if (two.length < 2) return `I need two sessions with lap times to compare; ${name} has ${two.length}.` + cite(two);
    const [a, b] = two, ba = Math.min(...lapsOf(a)), bb = Math.min(...lapsOf(b));
    let r = `Latest best lap ${fmtLap(ba)} s against ${fmtLap(bb)} s the time before (${ba < bb ? num(bb - ba) + " s faster" : ba > bb ? num(ba - bb) + " s slower" : "the same"}).`;
    if (lapsOf(a).length > 1 && lapsOf(b).length > 1) r += ` Average lap ${fmtLap(mean(lapsOf(a)))} s against ${fmtLap(mean(lapsOf(b)))} s.`;
    return r + cite(two);
  }
  if (/work on|improve|focus|better|practi[cs]e/.test(ql)) {
    const s = ss.find(x => lapsOf(x).length > 2);
    if (!s) return `To spot what to work on I need a session with at least 3 laps timed. With a sensor (Pro/Elite) I can also look at starts, crossovers and posture.` + cite(ss.slice(0, 1));
    const L = lapsOf(s), m = mean(L), sd = Math.sqrt(mean(L.map(x => (x - m) ** 2))), cv = sd / m * 100;
    const slowest = L.indexOf(Math.max(...L)) + 1;
    return (cv > 3 ? `${Name}'s lap times varied quite a lot (${num(cv)}% spread; lap ${slowest} was slowest). Work on even pacing: a few sets of 3 laps aiming for the same time each lap.`
                   : `${Name}'s laps were very even (${num(cv)}% spread), so pacing is good. The next gains are usually in the start and in the corners; a sensor session would show which.`) + cite([s]);
  }
  if (/note|coach|summary for/.test(ql)) {
    const wk = ss.filter(s => (Date.now() - new Date(s.date)) < 7 * 864e5);
    const bests = wk.map(bestLapOf).filter(Boolean);
    return `Note for the coach:\n${Name} skated ${wk.length} session${wk.length === 1 ? "" : "s"} this week${bests.length ? `, best lap ${fmtLap(Math.min(...bests))} s` : ""}. ${wk.some(s => s.type === "race") ? "Includes a race. " : ""}Times are hand-timed. Anything you'd like ${name} to focus on next week?` + cite(wk);
  }
  if (/week|doing|how is|how am|progress|trend/.test(ql)) {
    const wk = ss.filter(s => (Date.now() - new Date(s.date)) < 7 * 864e5);
    const bests = ss.map(bestLapOf).filter(Boolean);
    return `${Name} skated ${wk.length} session${wk.length === 1 ? "" : "s"} in the last 7 days (${ss.length} in total).${bests.length ? ` Best lap so far ${fmtLap(Math.min(...bests))} s.` : ""} ${ss.length < 4 ? "That's not enough sessions to call a trend yet; a few more will tell." : ""}` + cite(wk.length ? wk : ss.slice(0, 2));
  }
  return `I can answer questions about ${k.self ? "your" : name + "'s"} sessions, lap times and what to work on. Try one of the suggestions.`;
}

};
screens.club.init = () => {
  if (!$("#annpost")) return; wireWho();
  $("#annpost").onclick = () => { const v = $("#ann").value.trim(); if (!v) return; S.club.announcements.push({ id: uid(), text: v, at: new Date().toISOString() }); persist(); render(); toast(t("saved")); };
  document.querySelectorAll("[data-assign]").forEach(sel => sel.onchange = () => { S.club.members[sel.dataset.assign] = { planId: sel.value || null, since: dayKey(new Date()) }; persist(); render(); });
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => { const s = memberStatus(b.dataset.pay);
    S.club.payments.push({ id: uid(), skater_id: b.dataset.pay, plan_id: s.fp.id, period: s.pk, amount: s.fp.amount, at: new Date().toISOString(), method: "recorded" }); persist(); render(); toast(t("saved")); });
  document.querySelectorAll("[data-chpay]").forEach(b => b.onclick = () => { const [cid, kid] = b.dataset.chpay.split("|"), ch = S.club.charges.find(x => x.id === cid);
    ch.paid = ch.paid || {}; ch.paid[kid] = new Date().toISOString(); persist(); render(); toast(t("saved")); });
  $("#fsave").onclick = () => { const n = $("#fn").value.trim(), a = +$("#fa").value; if (!n || !(a > 0)) return;
    S.club.feePlans.push({ id: uid(), name: n, amount: a, period: $("#fp").value }); persist(); render(); toast(t("saved")); };
  $("#xsave").onclick = () => { const n = $("#xn").value.trim(), a = +$("#xa").value; if (!n || !(a > 0)) return;
    const ids = [...document.querySelectorAll("[data-xk]")].filter(c => c.checked).map(c => c.dataset.xk);
    S.club.charges.push({ id: uid(), name: n, amount: a, date: $("#xd").value, skater_ids: ids, paid: {} }); persist(); render(); toast(t("saved")); };
};

// ================================================================ router
const OPEN = ["welcome", "phone", "otp"];
const SHELL = ["home", "plan", "skate", "insights", "learn", "club"];
function render() {
  document.documentElement.lang = LANG;
  $("#proto").textContent = t("proto_banner");
  let r = (location.hash || "#").slice(1) || nextRoute();
  if (!screens[r]) r = nextRoute();
  const nr = nextRoute();
  if (r !== "racevideo" && typeof VID !== "undefined" && VID.stream && !(VID.rec && VID.rec.state === "recording")) vidStop();   // camera off when leaving
  if (!S.loggedIn) { if (!OPEN.includes(r)) r = "welcome"; }
  else if (OPEN.includes(r)) r = nr;
  else if (nr !== "home") {                                                       // finish onboarding first (going back is fine)
    const ORDER = ["role", "profile", "consent", "skater"];
    if (!(ORDER.includes(r) && ORDER.indexOf(r) <= ORDER.indexOf(nr) && r !== "role")) r = nr;
  }
  if (r === "skater" && role() !== "parent") r = "home";
  if (["invite", "club", "attend"].includes(r) && role() !== "coach") r = "home";
  if (r === "learn" && role() === "coach") r = "club";
  if (("#" + r) !== location.hash) history.replaceState(null, "", "#" + r);
  document.body.classList.toggle("onboard", !SHELL.includes(r));
  document.body.classList.toggle("gz", ["skate", "sensor", "practice", "live", "races", "raceadd", "race", "racestart", "racepost", "meetclose", "manual", "stopwatch"].includes(r));
  $("#tabs").hidden = !SHELL.includes(r);
  if (SHELL.includes(r)) shellTabs(r);
  $("#app").innerHTML = screens[r]() || "";
  if (screens[r].init) screens[r].init();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
